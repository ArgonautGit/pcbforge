[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/capture",
    "crates/ingest",
    "crates/cam",
    "crates/vision",
    "crates/orchestra",
    "crates/drivers",
    "crates/testkit",
    "crates/cli",
    "crates/ui",
    "xtask",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
pcb-core = { path = "crates/core" }

# The calibration/vision tests synthesize and scan whole camera frames;
# unoptimized they dominate the suite's runtime, so test builds get optimized
# code at the cost of slightly slower compilation.
[profile.test]
opt-level = 2
