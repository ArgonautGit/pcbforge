[package]
name = "ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
egui = "0.29"
orchestra = { path = "../orchestra" }
cam = { path = "../cam" }
ingest = { path = "../ingest" }
pcb-core = { workspace = true }
eframe = { version = "0.29", optional = true, default-features = false, features = ["glow", "default_fonts"] }

[features]
native = ["dep:eframe"]

[lib]
name = "ui"
path = "src/lib.rs"

[[bin]]
name = "pcbforge-console"
path = "src/main.rs"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
