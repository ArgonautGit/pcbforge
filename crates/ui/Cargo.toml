[package]
name = "ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
egui = "0.29"
orchestra = { path = "../orchestra" }
cam = { path = "../cam" }
ingest = { path = "../ingest" }
vision = { path = "../vision" }
pcb-core = { workspace = true }
nalgebra = "0.35.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
eframe = { version = "0.29", optional = true, default-features = false, features = ["glow", "default_fonts"] }
nokhwa = { version = "0.10", optional = true, features = ["input-native"] }

[features]
native = ["dep:eframe"]
# Real webcam capture via nokhwa (needs a camera + platform backend). Off by
# default; the File source drives the live preview everywhere without it.
camera = ["dep:nokhwa"]

[lib]
name = "ui"
path = "src/lib.rs"

[[bin]]
name = "pcbforge-console"
path = "src/main.rs"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
