[package]
name = "ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
egui = "0.30"
capture = { path = "../capture" }
orchestra = { path = "../orchestra" }
cam = { path = "../cam" }
drivers = { path = "../drivers" }
ingest = { path = "../ingest" }
vision = { path = "../vision" }
calib = { path = "../calib" }
pcb-core = { workspace = true }
nalgebra = "0.35.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
eframe = { version = "0.30", optional = true, default-features = false, features = ["glow", "default_fonts"] }

[features]
native = ["dep:eframe"]
# Real webcam capture (needs a camera + platform backend). Off by default; the
# File source drives the live preview everywhere without it.
camera = ["capture/camera"]

[lib]
name = "ui"
path = "src/lib.rs"

[[bin]]
name = "pcbforge-console"
path = "src/main.rs"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
# Headless UI driving + screenshots (see examples/debug_driver.rs and
# AGENT_DEBUGGING.md). `wgpu` enables software-rendered screenshots; `snapshot`
# enables image-diff baselines.
egui_kittest = { version = "0.30", features = ["wgpu", "snapshot"] }
# For the debug_driver's accessibility-tree dump (matches kittest's node type).
accesskit_consumer = "0.25"
# Integration tests are a separate crate and can't name `ui`'s normal deps, so
# expose egui to them explicitly (same version).
egui = "0.30"
# Per-harness temp directories so persisted operator fields can't bleed between
# tests or runs (see tests/common/mod.rs).
tempfile = "3"
