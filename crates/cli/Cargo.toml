[package]
name = "pcbforge"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
cam = { path = "../cam" }
capture = { path = "../capture" }
ingest = { path = "../ingest" }
orchestra = { version = "0.1.0", path = "../orchestra" }
vision = { path = "../vision" }
pcb-core = { workspace = true }
nalgebra = "0.35.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[features]
# Real webcam capture for `pcbforge cam` (needs a camera + platform backend).
camera = ["capture/camera"]

[dev-dependencies]
testkit = { path = "../testkit" }
image = { version = "0.25", default-features = false, features = ["png"] }
# Self-removing scratch dirs for the e2e tests, so runs neither share a
# directory nor leave one behind.
tempfile = "3"
