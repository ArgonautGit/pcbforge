[package]
name = "capture"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
nokhwa = { version = "0.10", optional = true, features = ["input-native"] }

[features]
# Real webcam capture via nokhwa (needs a camera + platform backend). Off by
# default; the File source drives capture everywhere without it.
camera = ["dep:nokhwa"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
